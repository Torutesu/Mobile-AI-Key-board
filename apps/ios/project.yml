name: MobileAIKeyboard
options:
  bundleIdPrefix: com.torutesu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  MobileAIKeyboardCore:
    path: .
targets:
  MobileAIKeyboardHost:
    type: application
    platform: iOS
    sources:
      - path: MobileAIKeyboardHost
    resources:
      - path: MobileAIKeyboardHost/PrivacyInfo.xcprivacy
    dependencies:
      - package: MobileAIKeyboardCore
      - target: MobileAIKeyboardExtension
        embed: true
    entitlements:
      path: MobileAIKeyboardHost/Host.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.torutesu.mobileaikeyboard
    info:
      path: MobileAIKeyboardHost/Info.plist
      properties:
        CFBundleDisplayName: Mobile AI Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchStoryboardName: LaunchScreen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.torutesu.mobileaikeyboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2026082701"
        TARGETED_DEVICE_FAMILY: "1,2"
  MobileAIKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MobileAIKeyboardExtension
    resources:
      - path: MobileAIKeyboardExtension/PrivacyInfo.xcprivacy
    dependencies:
      - package: MobileAIKeyboardCore
    entitlements:
      path: MobileAIKeyboardExtension/Extension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.torutesu.mobileaikeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.torutesu.mobileaikeyboard.keyboard
        INFOPLIST_FILE: MobileAIKeyboardExtension/Info.plist
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2026082701"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: MobileAIKeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: Mobile AI Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
  MobileAIKeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MobileAIKeyboardHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.torutesu.mobileaikeyboard.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: MobileAIKeyboardHost
schemes:
  MobileAIKeyboard:
    build:
      targets:
        MobileAIKeyboardHost: all
        MobileAIKeyboardExtension: all
    test:
      targets:
        - name: MobileAIKeyboardUITests
          parallelizable: false
          randomExecutionOrder: false
