name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
jobs:
  shared:
    name: Shared contracts and services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Deliberately explicit: the release manifest requires a visible CI step,
      # even though pnpm check also exercises test:release transitively.
      - run: pnpm shortcuts:vectors:check
      # Both native unit suites must directly consume the same checked-in
      # fixture before cross-language shortcut parity can be reported.
      - name: Verify native shortcut-vector consumers
        run: pnpm shortcuts:vectors:native-check -- --report "$RUNNER_TEMP/shortcut-native-consumption.json"
      # Builder/Install -> A-Z assignment -> native snapshot/IME is a source
      # contract. --strict fails closed if either platform loses a seam.
      # This does not create physical-device or third-party-app evidence.
      - name: Verify shortcut vertical-slice source contract
        run: node scripts/check-shortcut-vertical-slice.mjs --strict
      - run: pnpm audit --prod --audit-level high
      - name: Run deterministic performance regression diagnostic
        run: pnpm benchmark:performance -- --report "$RUNNER_TEMP/performance-benchmark.json"
      - name: Run release readiness static gate
        run: pnpm release:readiness -- --static-only --benchmark "$RUNNER_TEMP/performance-benchmark.json" --report "$RUNNER_TEMP/release-readiness.json"
      - name: Upload release readiness report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-readiness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-readiness.json
            ${{ runner.temp }}/performance-benchmark.json
            ${{ runner.temp }}/shortcut-native-consumption.json
          if-no-files-found: error

  ios:
    name: iOS host, extension, and core
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: brew install xcodegen
      - run: swift test
      - run: xcodegen generate --spec project.yml
      # iphonesimulator compilation is a simulator/source check only; it is
      # never uploaded as protected physical-device E2E evidence.
      - run: >-
          xcodebuild
          -project MobileAIKeyboard.xcodeproj
          -scheme MobileAIKeyboard
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/mobile-ai-keyboard-derived"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Exercise private Skill to A-Z assignment on iOS Simulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device["name"].startswith("iPhone") and device.get("isAvailable", False)))')"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild \
            -project MobileAIKeyboard.xcodeproj \
            -scheme MobileAIKeyboard \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/mobile-ai-keyboard-ui-derived" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Verify iOS privacy and extension boundary
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/mobile-ai-keyboard-derived/Build/Products/Debug-iphonesimulator/MobileAIKeyboardHost.app"
          extension="$app/PlugIns/MobileAIKeyboardExtension.appex"
          plutil -lint MobileAIKeyboardHost/PrivacyInfo.xcprivacy MobileAIKeyboardExtension/PrivacyInfo.xcprivacy
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$extension/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:RequestsOpenAccess' "$extension/Info.plist")" = "true"

  android:
    name: Android app, IME, and core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Enable KVM acceleration for the Android emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          # ubuntu-latest can return 1 here even when the pre-existing KVM
          # device is healthy. The capability checks below remain fail-closed.
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - run: chmod +x gradlew
      # JVM tests, lint, and a debug APK do not exercise an emulator or a
      # physical IME; release evidence must remain not_proven until protected.
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Exercise A-Z assignment and ordinary-input boundary on Android Emulator
        timeout-minutes: 18
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd \
            --force \
            --name mobile-ai-keyboard-ci \
            --package 'system-images;android-35;google_apis;x86_64' \
            --device pixel_2 \
            </dev/null
          avdmanager list avd
          test -f "$ANDROID_AVD_HOME/mobile-ai-keyboard-ci.ini"
          "$ANDROID_HOME/emulator/emulator" -avd mobile-ai-keyboard-ci -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect >"$RUNNER_TEMP/android-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            exit_code=$?
            if (( exit_code != 0 )); then
              echo '::group::Android emulator diagnostics'
              adb devices -l || true
              cat "$RUNNER_TEMP/android-emulator.log" || true
              echo '::endgroup::'
            fi
            adb emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
            exit "$exit_code"
          }
          trap cleanup EXIT
          timeout 120 adb wait-for-device
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          timeout 300 adb shell am instrument -w -r com.torutesu.mobileaikeyboard.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/android-instrumentation.log"
          grep -Eq '^OK \([0-9]+ tests?\)$' "$RUNNER_TEMP/android-instrumentation.log"
          adb emu kill || true
          wait "$emulator_pid" 2>/dev/null || true
          trap - EXIT
      - name: Verify Android offline keyboard boundary
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          permissions="$($ANDROID_HOME/build-tools/35.0.0/aapt2 dump permissions "$apk")"
          if grep -Fq android.permission.INTERNET <<<"$permissions"; then
            echo "Unexpected INTERNET permission in keyboard APK" >&2
            exit 1
          fi
