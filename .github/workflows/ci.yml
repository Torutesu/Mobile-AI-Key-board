name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
jobs:
  shared:
    name: Shared contracts and services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level high
      - name: Run release readiness static gate
        run: pnpm release:readiness -- --static-only --report "$RUNNER_TEMP/release-readiness.json"
      - name: Upload release readiness report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/release-readiness.json
          if-no-files-found: error

  ios:
    name: iOS host, extension, and core
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: brew install xcodegen
      - run: swift test
      - run: xcodegen generate --spec project.yml
      - run: >-
          xcodebuild
          -project MobileAIKeyboard.xcodeproj
          -scheme MobileAIKeyboard
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/mobile-ai-keyboard-derived"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Verify iOS privacy and extension boundary
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/mobile-ai-keyboard-derived/Build/Products/Debug-iphonesimulator/MobileAIKeyboardHost.app"
          extension="$app/PlugIns/MobileAIKeyboardExtension.appex"
          plutil -lint MobileAIKeyboardHost/PrivacyInfo.xcprivacy MobileAIKeyboardExtension/PrivacyInfo.xcprivacy
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$extension/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:RequestsOpenAccess' "$extension/Info.plist")" = "true"

  android:
    name: Android app, IME, and core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify Android offline keyboard boundary
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          permissions="$($ANDROID_HOME/build-tools/35.0.0/aapt2 dump permissions "$apk")"
          if grep -Fq android.permission.INTERNET <<<"$permissions"; then
            echo "Unexpected INTERNET permission in keyboard APK" >&2
            exit 1
          fi
