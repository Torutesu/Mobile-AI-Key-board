name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      UPLOAD_TO_TESTFLIGHT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository gate
        run: pnpm check

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install signing identity and profiles
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_HOST_PROFILE_BASE64: ${{ secrets.IOS_HOST_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/mobile-ai-keyboard.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychain -d user -s "$keychain"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_HOST_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/host.mobileprovision"
          printf '%s' "$IOS_EXTENSION_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/extension.mobileprovision"

      - name: Install App Store Connect API key
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          key_dir="$RUNNER_TEMP/appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$key_dir/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive, inspect, and upload exact candidate
        run: apps/ios/scripts/archive-testflight.sh

      - name: Upload archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-${{ github.sha }}
          path: |
            /tmp/MobileAIKeyboard.xcarchive/Info.plist
            /tmp/MobileAIKeyboard-TestFlight/DistributionSummary.plist
            /tmp/MobileAIKeyboard-TestFlight/ExportOptions.plist
          if-no-files-found: warn
          retention-days: 14
