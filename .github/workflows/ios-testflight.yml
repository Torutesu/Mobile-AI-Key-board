name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_APPLE_ID: ${{ secrets.ASC_APPLE_ID }}
      IOS_SOURCE_COMMIT: ${{ github.sha }}
      UPLOAD_TO_TESTFLIGHT: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository gate
        run: pnpm check

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate required release secrets and bind candidate paths
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_HOST_PROFILE_BASE64: ${{ secrets.IOS_HOST_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          : "${IOS_DEVELOPMENT_TEAM:?missing IOS_DEVELOPMENT_TEAM}"
          : "${IOS_DISTRIBUTION_P12_BASE64:?missing IOS_DISTRIBUTION_P12_BASE64}"
          : "${IOS_DISTRIBUTION_P12_PASSWORD:?missing IOS_DISTRIBUTION_P12_PASSWORD}"
          : "${IOS_HOST_PROFILE_BASE64:?missing IOS_HOST_PROFILE_BASE64}"
          : "${IOS_EXTENSION_PROFILE_BASE64:?missing IOS_EXTENSION_PROFILE_BASE64}"
          : "${ASC_KEY_ID:?missing ASC_KEY_ID}"
          : "${ASC_ISSUER_ID:?missing ASC_ISSUER_ID}"
          : "${ASC_APPLE_ID:?missing ASC_APPLE_ID}"
          : "${ASC_PRIVATE_KEY_BASE64:?missing ASC_PRIVATE_KEY_BASE64}"
          candidate_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::12}"
          candidate_root="$RUNNER_TEMP/MobileAIKeyboard-$candidate_id"
          echo "IOS_BUILD_NUMBER=${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "IOS_CANDIDATE_ID=$candidate_id" >> "$GITHUB_ENV"
          echo "IOS_CANDIDATE_ROOT=$candidate_root" >> "$GITHUB_ENV"
          echo "IOS_ARCHIVE_PATH=$candidate_root/MobileAIKeyboard.xcarchive" >> "$GITHUB_ENV"
          echo "IOS_EXPORT_PATH=$candidate_root/TestFlight" >> "$GITHUB_ENV"
          echo "IOS_DERIVED_DATA_PATH=$candidate_root/DerivedData" >> "$GITHUB_ENV"
          echo "IOS_CANDIDATE_EVIDENCE_PATH=$candidate_root/candidate-evidence.json" >> "$GITHUB_ENV"

      - name: Install signing identity and profiles
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_HOST_PROFILE_BASE64: ${{ secrets.IOS_HOST_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/mobile-ai-keyboard.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychain -d user -s "$keychain"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_HOST_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/host.mobileprovision"
          printf '%s' "$IOS_EXTENSION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/extension.mobileprovision"
          apps/ios/scripts/validate-provisioning-profile.sh "$RUNNER_TEMP/host.mobileprovision" com.torutesu.mobileaikeyboard "$IOS_DEVELOPMENT_TEAM" group.com.torutesu.mobileaikeyboard
          apps/ios/scripts/validate-provisioning-profile.sh "$RUNNER_TEMP/extension.mobileprovision" com.torutesu.mobileaikeyboard.keyboard "$IOS_DEVELOPMENT_TEAM" group.com.torutesu.mobileaikeyboard
          for profile in "$RUNNER_TEMP/host.mobileprovision" "$RUNNER_TEMP/extension.mobileprovision"; do
            uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -)"
            cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          done

      - name: Install App Store Connect API key
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          key_dir="$RUNNER_TEMP/appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$key_dir/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=$key_dir" >> "$GITHUB_ENV"

      - name: Archive, inspect, and upload exact candidate
        run: apps/ios/scripts/archive-testflight.sh

      - name: Upload archive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-testflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/MobileAIKeyboard-*/MobileAIKeyboard.xcarchive/Info.plist
            ${{ runner.temp }}/MobileAIKeyboard-*/TestFlight/DistributionSummary.plist
            ${{ runner.temp }}/MobileAIKeyboard-*/TestFlight/ExportOptions.plist
            ${{ runner.temp }}/MobileAIKeyboard-*/candidate-evidence.json
            ${{ runner.temp }}/MobileAIKeyboard-*/TestFlight/processing-status.json
          if-no-files-found: warn
          retention-days: 14
